<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>RGBA SVG Shapes</title>
</head>

<body>
    <p>RGBA SVG Shapes</p>
    <svg width="600" height="600">
        <circle cx="100" cy="150" r="100" fill="rgba(128, 0, 128, 1.0)" />
        <circle cx="200" cy="150" r="100" fill="rgba(0, 0, 255, 0.75)" />
        <circle cx="300" cy="150" r="100" fill="rgba(0, 255, 0, 0.5)" />
        <circle cx="400" cy="150" r="100" fill="rgba(255, 255, 0, 0.25)" />
        <circle cx="500" cy="150" r="100" fill="rgba(255, 0, 0, 0.1)" />
    </svg>
</body>

</html>
