<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Using External CSS in HTML</title>
    <link rel="stylesheet" href="external.css">

    <p>The document head contains all metadata about the document, such as its title and any references to <br>external stylesheets and scripts. Every HTML file is separated into a header element, <br> which generally contains information about the document, and a body, which contains the page content</p>
