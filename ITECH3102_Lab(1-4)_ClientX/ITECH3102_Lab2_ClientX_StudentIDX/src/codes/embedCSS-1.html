<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title> Cascading Style Sheets example </title>
    <style type="text/css">
        EM { background-color:#8000FF; color: white }
        H1 {font-family: Arial, sans-serif }
        P {font-size: 18pt }
        .blue {color: blue}
    </style>
</head>
<body>
    <H1 class="blue"> A heading </H1>
    <P> Here is some test. This is an example of using style sheets<br>. This is an example of using style sheets</P>
    <H1>Another Heading</H1>
    <P class="blue"> Here is some <em>mort</em> test. We use style sheets in this example.<br> We use style sheets in this example.</P>
</body>
</html>
