<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>JavaScript user-defined function example</title>
    <script language = "JavaScript">
        document.writeln("<H1>Square the numbers from 1 to 10</H1>");
        for (var x = 1; x <= 10; ++x)
            document.writeln("The square of " + x + " is " + square(x) + "<br>");
        function square(y) {
            return y * y;
        }
    </script>
</head>
<body></body>
</html>
