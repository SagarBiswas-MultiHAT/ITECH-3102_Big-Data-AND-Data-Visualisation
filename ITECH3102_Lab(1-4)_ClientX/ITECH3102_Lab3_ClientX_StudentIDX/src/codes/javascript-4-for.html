<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>JavaScript repetition structure example: for</title>
    <script language = "JavaScript">
        for (var counter = 1; counter <= 7; ++counter) {
            document.writeln("<p><font size = " + counter + ">HTML font size " + counter + "</font></p>");
        }
    </script>
</head>
<body></body>
</html>
