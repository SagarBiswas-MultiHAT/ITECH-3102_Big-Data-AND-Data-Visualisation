<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>JavaScript repetition structure example: while</title>
    <script language = "JavaScript">
        var counter = 1;
        while (counter <= 6) {
            document.writeln("<p><font size = " + counter + ">HTML font size " + counter + "</font></p>");
            counter = counter + 1;
        }
    </script>
</head>
<body></body>
</html>
