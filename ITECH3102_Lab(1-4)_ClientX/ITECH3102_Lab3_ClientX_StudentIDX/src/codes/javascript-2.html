<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>JavaScript selection structure example</title>
    <script language="JavaScript">
        var grade;
        grade = window.prompt("Enter a grade from 0 to 100");
        if (grade >= 50)
            document.writeln("You pass this course");
        else {
            document.writeln("Failed<br>");
            document.writeln("You must take this course again.");
        }
    </script>
</head>
<body>
    <p>Click refresh to run this script again.</p>
</body>
</html>
